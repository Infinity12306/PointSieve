[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pointsieve"
version = "0.1.0"
description = "Minimal reproduction code for PointSieve 3D object detection"
requires-python = ">=3.10,<3.13"

[tool.setuptools.packages.find]
include = ["spatiallm*", "utils*"]
