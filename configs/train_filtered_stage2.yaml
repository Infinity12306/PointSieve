model_name_or_path: artifacts/stage2_bboxmask
validate_scorer_filtered_lineage: true
scorer_path_for_lineage: artifacts/scorer
trust_remote_code: true
model_torch_dtype: auto

filtered_point_token_dir: artifacts/filtered_cache/train
eval_filtered_point_token_dir: artifacts/filtered_cache/val
template: spatiallm_qwen
num_bins: 1280
world_size: 16.0
cutoff_len: 8192
max_point_tokens: 4096
shard_cache_size: 1
shard_local_shuffle: true

freeze_point_backbone: true
freeze_point_projector: true
require_llm_only_training: true
pure_bf16: false

output_dir: artifacts/stage2_scorer_filtered
overwrite_output_dir: false
auto_resume_from_latest_checkpoint: true
reset_scheduler_on_resume: false
ignore_data_skip: false
logging_steps: 10
save_steps: 500
save_total_limit: 5
num_train_epochs: 1
required_num_train_epochs: 1
per_device_train_batch_size: 2
per_device_eval_batch_size: 2
gradient_accumulation_steps: 16
learning_rate: 5.0e-5
weight_decay: 0.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
gradient_checkpointing: false
bf16: true
fp16: false
tf32: true
dataloader_num_workers: 8
dataloader_persistent_workers: false
dataloader_pin_memory: true
eval_strategy: steps
eval_steps: 500
report_to: wandb
wandb_project: pointsieve
wandb_run_name: pointsieve_stage2_scorer_filtered
