wandb_project: pointsieve
wandb_run_name: pointsieve_hierarchical

base:
  model_name_or_path: artifacts/base
  trust_remote_code: true
  do_train: true
  freeze_language_tower: false
  freeze_point_tower: false
  train_proj_only: false
  dataset_dir: data/spatiallm
  template: spatiallm_qwen
  num_bins: 1280
  do_augmentation: false
  random_rotation: true
  cutoff_len: 8192
  overwrite_cache: true
  preprocessing_num_workers: 8
  dataloader_num_workers: 8
  dataloader_persistent_workers: false
  logging_steps: 10
  save_total_limit: 5
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 1.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  gradient_checkpointing: false
  pure_bf16: false
  bf16: true
  fp16: false
  tf32: true
  ddp_timeout: 180000000
  report_to: wandb
  max_new_tokens: 4096

stage1:
  dataset: spatiallm_stage1_region_train_20000
  eval_dataset: spatiallm_stage1_region_val
  output_dir: artifacts/stage1
  num_train_epochs: 4
  world_size: 32.0
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 16
  save_steps: 500
  eval_strategy: steps
  eval_steps: 250
  run_name: pointsieve_stage1

stage2:
  dataset: spatiallm_stage2_bbox_train_20000
  eval_dataset: spatiallm_stage2_bbox_val
  output_dir: artifacts/stage2_plain
  num_train_epochs: 4
  world_size: 16.0
  max_point_tokens: 4096
  model_name_or_path: artifacts/base
  save_steps: 1000
  eval_strategy: steps
  eval_steps: 500
  run_name: pointsieve_stage2_plain
